<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>2D 自动驾驶 - 3D 俯视</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; }
    #canvas-container { position: relative; width: 1800px; height: 800px; margin: 20px auto; }
    canvas { display: block; }

    #hud {
      position: absolute; top: 10px; left: 15px;
      color: #fff; font-family: monospace; font-size: 13px;
      pointer-events: none; z-index: 10;
      line-height: 1.6;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #hud .state-normal  { color: #44ff44; font-weight: bold; }
    #hud .state-avoid  { color: #ff4444; font-weight: bold; }

    /* 顶栏两簇（世界 / 控制） */
    #world-cluster, #control-cluster {
      position: absolute; right: 15px; z-index: 20; pointer-events: all;
      display: flex; gap: 8px; align-items: center;
    }
    #world-cluster { top: 10px; }
    #control-cluster { top: 52px; }
    .cluster-label { color: #888; font-family: monospace; font-size: 11px; margin-right: 2px; }
    #world-cluster select, #control-cluster button {
      background: #333; color: #fff; border: 1px solid #666;
      padding: 6px 10px; font-family: monospace; font-size: 13px;
      border-radius: 4px; cursor: pointer;
    }
    #world-cluster select:hover, #control-cluster button:hover { background: #444; }

    #replay-bar button, #replay-bar select {
      background: #333; color: #fff; border: 1px solid #666;
      padding: 4px 8px; font-family: monospace; font-size: 12px;
      border-radius: 4px; cursor: pointer;
    }
    #replay-bar button:hover { background: #444; }
    .replay-marker {
      position: absolute; top: 0; width: 6px; height: 6px; margin-left: -3px;
      border-radius: 50%; background: #ff4444; cursor: pointer; pointer-events: auto;
    }

    /* 底部上下文提示条（文案由 UI 状态机驱动） */
    #hint-bar {
      position: absolute; bottom: 10px; left: 15px;
      z-index: 10; pointer-events: none;
      color: #888; font-family: monospace; font-size: 11px;
    }

    /* inspect 面板标题栏（可折叠） */
    #inspect-header {
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: auto; margin-bottom: 4px;
    }
    #btn-inspect-toggle {
      background: #222; color: #0f0; border: 1px solid #555; cursor: pointer;
      font-family: monospace; font-size: 11px; border-radius: 3px; padding: 0 6px;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>

    <!-- 世界选择（地图 + 场景） -->
    <div id="world-cluster">
      <span class="cluster-label">世界</span>
      <select id="map-dropdown">
        <option value="oval">Oval</option>
        <option value="hairpin">Hairpin</option>
        <option value="highway">Highway</option>
        <option value="tech_circuit">Tech Circuit</option>
      </select>
      <select id="scenario-dropdown" title="加载场景（与 headless 同源）">
        <option value="">随机场景</option>
      </select>
    </div>

    <!-- 控制（仿真 / 数据 / 视图） -->
    <div id="control-cluster">
      <span class="cluster-label">控制</span>
      <button id="btn-pause" title="暂停/继续 (Space)">&#9208;</button>
      <button id="btn-replay-mode" title="回放已归档运行">&#9194;</button>
      <button id="btn-export" title="导出运行归档 (.run.json)">&#128190;</button>
      <button id="btn-import" title="导入归档并回放">&#128194;</button>
      <button id="btn-reset-view" title="重置视角 (R)">&#8634;</button>
    </div>

    <!-- 回放栏 -->
    <div id="replay-bar" style="display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
      z-index:30;background:rgba(0,0,0,0.85);padding:8px 12px;border-radius:6px;
      gap:8px;align-items:center;color:#fff;font-family:monospace;font-size:12px;width:900px;">
      <button id="btn-replay-play" title="播放/暂停">&#9199;</button>
      <div id="replay-track" style="position:relative;flex:1;">
        <input id="replay-timeline" type="range" min="0" max="0" value="0" style="width:100%;">
        <div id="replay-markers" style="position:absolute;left:0;right:0;top:-2px;height:8px;pointer-events:none;"></div>
      </div>
      <span id="replay-step-label">0 / 0</span>
      <select id="replay-speed">
        <option value="0.5">0.5&times;</option>
        <option value="1" selected>1&times;</option>
        <option value="2">2&times;</option>
        <option value="4">4&times;</option>
      </select>
      <button id="btn-replay-prev" title="上一帧">&lang;</button>
      <button id="btn-replay-next" title="下一帧">&rang;</button>
      <button id="btn-replay-close" title="退出回放">&times;</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div>地图: <span id="hud-map">---</span></div>
      <div>场景: <span id="hud-scenario">---</span></div>
      <div>前方: <span id="hud-front">---</span></div>
      <div>速度: <span id="hud-speed" style="pointer-events:auto;cursor:pointer;" title="点击切换 km/h ↔ m/s">---</span></div>
      <div class="state-normal"  id="hud-state">状态: NORMAL 巡航中</div>
      <div>转向: <span id="hud-steer">---</span> rad | 油门: <span id="hud-throttle">---</span></div>
      <div style="color:#888;font-size:10px;margin-top:4px;">
        LiDAR: <span id="hud-rays">0</span> 条射线 |
        障碍物: <span id="hud-obstacles">0</span> 个
      </div>
      <div id="hud-obstacle-info" style="color:#ffaa00;font-size:11px;margin-top:2px;min-height:16px;"></div>
      <div id="hud-route" style="color:#ffaa00;font-size:11px;margin-top:2px;min-height:16px;">路线: 点击赛道设置</div>
      <div id="hud-gps" style="color:#8888ff;font-size:10px;margin-top:2px;min-height:14px;">GPS: ---</div>
    </div>

    <!-- 底部上下文提示（文案由 UI 状态机驱动，当前为静态占位） -->
    <div id="hint-bar">右键设置路线起点 · 左键查看物体 · Space 暂停 · R 重置视角</div>

    <!-- 物体点击提示 -->
    <div id="object-tooltip" style="display:none;position:fixed;z-index:100;pointer-events:none;
      color:#fff;font-family:monospace;font-size:11px;background:rgba(0,0,0,0.85);
      padding:5px 8px;border-radius:3px;line-height:1.5;white-space:nowrap;">
    </div>

    <!-- Inspect 面板 -->
    <div id="inspect-panel" style="position:absolute;bottom:10px;right:15px;
      z-index:20;pointer-events:none;color:#0f0;font-family:monospace;font-size:10px;
      background:rgba(0,0,0,0.85);padding:8px 10px;border-radius:4px;line-height:1.4;
      max-height:400px;overflow-y:auto;width:280px;">
      <div id="inspect-header">
        <span>Inspect</span>
        <button id="btn-inspect-toggle" title="折叠/展开 (I)">&#9662;</button>
      </div>
      <pre id="inspect-body" style="margin:0;"></pre>
    </div>
  </div>

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="dist/js/main.js"></script>
</body>
</html>
